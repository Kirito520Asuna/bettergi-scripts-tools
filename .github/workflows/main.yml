# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Java Jar To Zip Publish
run-name: "[${{ (github.event_name == 'push' || ((inputs.push_to_docker_registry || inputs.push_to_github_release) == true)) && '正式版' || '测试版' }}] ${{ github.event.repository.name }} ${{ github.event.inputs.tag_name || github.ref_name || 'v-manual' }}  version"

permissions:
  contents: write          # 必须！允许创建/更新 Release + 上传 assets
  packages: write          # 如果你推送 Docker 镜像，也需要这个

on:
  push:
    branches:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '输入 Release 标签 (eg: v0.35.1, v0.36.5-alpha.1)'
        required: false
        type: string
        default: 'v-manual'
      skip_tests:
        description: '是否跳过测试 (true/false)'
        required: true
        type: boolean
        default: false
      java_version:
        description: '输入 Java 版本 (如 8, 11, 17)'
        required: true
        default: '21'
      jar_dir_prefix:
        description: 'JAR 文件前缀 (如 bgi-tools 或留空)'
        default: ''
      draft:
        description: '是否为草稿 Release (true/false)'
        type: boolean
        default: false
      prerelease:
        description: '是否为预发布 Release (true/false)'
        type: boolean
        default: false
      push_to_docker_registry:
        description: '是否推送到docker镜像仓库'
        required: true
        type: boolean
        default: false
      push_to_github_release:
        description: '是否推送到Github Release'
        required: true
        type: boolean
        default: false
      desc:
        description: 'Release 描述信息'
        required: false
        type: string
        default: ''
      icon_path:
        description: 'icon 图标'
        required: false
        type: string
        default: 'frontend/public/logo.ico'
      gitHub_release_text_path:
        description: 'Release 描述信息文件读取路径'
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_REF: ${{ github.ref }}

  TMP_EXTRACTED_JARS: /tmp/extracted-jars
  TMP_RENAMED_JARS: /tmp/renamed-jars
  TMP_EXTRACTED_EXES: /tmp/extracted-exes
  JARS_ZIP: bgi-tools-jars.zip
jobs:
  # 在 Linux 上构建 JAR 并打包为 ZIP
  build-jar:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.set_vars.outputs.tag_name }}
      java_version: ${{ steps.set_vars.outputs.java_version }}
      jar_dir_prefix: ${{ steps.set_vars.outputs.jar_dir_prefix }}
      push_to_docker_registry: ${{ steps.set_vars.outputs.push_to_docker_registry }}
      push_to_github_release: ${{ steps.set_vars.outputs.push_to_github_release }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 1. 调试触发信息
        run: |
          echo "事件类型: ${{ github.event_name }}"
          echo "引用: ${{ github.ref }}"
          echo "标签名: ${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "跳过测试: ${{ github.event.inputs.skip_tests || true }}"
          echo "Java 版本: ${{ github.event.inputs.java_version || secrets.JAVA_VERSION || '8' }}"
          echo "JAR 前缀: ${{ github.event.inputs.jar_dir_prefix || 'bgi-tools' }}"
          echo "草稿: ${{ github.event.inputs.draft || false }}"
          echo "预发布: ${{ github.event.inputs.prerelease || false }}"
          echo "仓库: ${{ github.repository }}"
          echo "提交 SHA: ${{ github.sha }}"

      - name: 2. 检出代码
        uses: actions/checkout@v5

      - name: 3. 设置 Java 环境
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version || secrets.JAVA_VERSION || '21' }}
          distribution: 'temurin'

      - name: 4. 安装 mvnd (Maven Daemon)
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          MVND_VERSION="1.0.5"
          install_Maven_Daemon "$MVND_VERSION"
        

      - name: 5. 设置输入参数和环境变量
        id: set_vars
        run: |
          # 初始化默认值
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name || 'v-manual' }}"
          # 处理布尔值（inputs 为字符串，需要转换）
          SKIP_TESTS="${{ inputs.skip_tests || 'false' }}"
          JAVA_VERSION="${{ inputs.java_version || secrets.JAVA_VERSION || '21' }}"
          JAR_DIR_PREFIX="${{ inputs.jar_dir_prefix || 'bgi-tools' }}"
          DRAFT="${{ inputs.draft || 'false' }}"
          PRERELEASE="${{ inputs.prerelease || 'false' }}"

          EVENT_NAME="${{ github.event_name }}"
          PUSH_DOCKER_REGISTRY="${{ inputs.push_to_docker_registry || 'false' }}"
          PUSH_GITHUB_RELEASE="${{ inputs.push_to_github_release || 'false' }}"
          
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          set_env_args "$TAG_NAME" "$SKIP_TESTS" "$JAVA_VERSION" "$JAR_DIR_PREFIX" "$DRAFT" "$PRERELEASE" "$EVENT_NAME" "$PUSH_DOCKER_REGISTRY" "$PUSH_GITHUB_RELEASE"
         

      - name: 6. 验证版本号格式
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          check_tag "$TAG_NAME"

      - name: 修改 pom.xml 文件和 yml version
        run: |
           source $GITHUB_WORKSPACE/.github/workflows/bash/update-version.sh
           update_version "${{env.TAG_NAME}}"

      - name: 生成覆盖配置文件
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          update_salt 
          update_check_token
          update_config

      - name: 7. 缓存 Maven 依赖
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 8. 使用 mvnd 构建项目
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          maven_build "${{ env.SKIP_TESTS }}"

      - name: 9.列出匹配的 JAR 文件
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          list_jar_files "${{ env.JAR_DIR_PREFIX }}"

      - name: 10.重命名 JAR 文件（移除版本号）
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          rename_jar_files "${{ env.JAR_DIR_PREFIX }}"

      - name: 11.打包所有 JAR 文件成 ZIP
        run: |          
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          package_jars_zip "$JARS_ZIP"

      - name: 12.解压 ZIP 文件
        run: |          
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          extract_jars_zip "$JARS_ZIP" "$TMP_EXTRACTED_JARS"

      - name: 13. 上传 JAR ZIP 供 Windows 使用
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.JARS_ZIP}}
          path: ${{env.JARS_ZIP}}

      - name: 14. 上传单个 JAR 文件
        uses: actions/upload-artifact@v7
        with:
          name: jar-files
          path: ${{env.TMP_EXTRACTED_JARS}}/*.jar

  # 新 Job: 在 Linux 上生成 Windows EXE（使用 Wine + MinGW）
  build-exe:
    runs-on: ubuntu-latest
    needs: build-jar
    outputs:
      tag_name: ${{ needs.build-jar.outputs.tag_name }}
      java_version: ${{ needs.build-jar.outputs.java_version }}
      push_to_docker_registry: ${{ needs.build-jar.outputs.push_to_docker_registry }}
      push_to_github_release: ${{ needs.build-jar.outputs.push_to_github_release }}
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.build-jar.outputs.tag_name }}
      JAVA_VERSION: ${{ needs.build-jar.outputs.java_version }}
      ICON_PATH: ${{ github.event.inputs.icon_path || 'frontend/public/logo.ico' }}
    steps:
      - name: 1. 检出代码（用于图标和可能需要的资源）
        uses: actions/checkout@v5

      - name: 2. 下载 JAR ZIP artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{env.JARS_ZIP}}
          path: ./

      - name: 3. 解压 JAR 到 ${{env.TMP_EXTRACTED_JARS}}
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          extract_jars "$JARS_ZIP"


      - name: 4. 安装 Wine 和 MinGW 工具链（cross-compile Windows exe）
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          install_mingw_wine

      - name: 5. 下载并配置 Launch4j（Linux 版）
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          setup_launch4j

      - name: 6. 下载 Windows JRE 并捆绑（2026 年兼容版）
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          download_windows_jre "${{ env.JAVA_VERSION }}"

      - name: 7. 为每个 JAR 生成 Windows EXE
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          build_exe "${{ env.TAG_NAME }}" "${{ env.ICON_PATH }}" "${{ github.event.repository.name }}"


      - name: 8. 打包独立运行包（EXE + JRE + 配置文件）
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/github.sh
          package_standalone "${{ github.event.repository.name }}"

      - name: 上传所有生成的 EXE 和 JRE（调试用）
        uses: actions/upload-artifact@v7
        with:
          name: windows-exes-and-jre
          path: ${{env.TMP_EXTRACTED_EXES}}/

      - name: 9. 上传独立运行包
        uses: actions/upload-artifact@v7
        with:
          name: windows-standalone
          path: ${{ github.event.repository.name }}-Windows.zip

      - name: 10. 上传单个 EXE（可选）
        uses: actions/upload-artifact@v7
        with:
          name: windows-exes
          path: ${{env.TMP_EXTRACTED_EXES}}/*.exe

  # 发布到 GitHub Release
  push-release:
    runs-on: ubuntu-latest
    needs: [build-exe]
    if: ${{ needs.build-exe.outputs.push_to_github_release == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 1. 设置发布信息
        run: |
          echo "当前工作目录：$(pwd)"
          echo "🚀 发布到 GitHub Release"
          
          # 初始化默认值
          DESC="${{ github.event.inputs.desc || '' }}"
          GitHub_Release_Text_Path="${{ github.event.inputs.gitHub_release_text_path || 'GitHub-Release.txt' }}"
          # 移除可能存在的前导斜杠
          GitHub_Release_Text_Path="${GitHub_Release_Text_Path#/}"
          # 构造文件路径（使用正确的仓库路径）
          GitHub_Release_Path="${{ github.workspace }}/$GitHub_Release_Text_Path"
          # 添加调试信息
          echo "🔍 工作目录：${{ github.workspace }}"
          echo "🔍 相对路径：${GitHub_Release_Text_Path}"
          echo "🔍 完整路径：${GitHub_Release_Path}"
          ls -la "${{ github.workspace }}/"
          
          # 读取文件内容并处理
          if [ -f "$GitHub_Release_Path" ]; then
            GitHub_Release=$(cat "$GitHub_Release_Path")
            echo "✅ 成功读取文件内容：$GitHub_Release_Path"
          else
            GitHub_Release=""
            echo "⚠️ 文件未找到，使用默认内容：$GitHub_Release"
          fi
      
          # 根据 DESC 是否为空决定是否覆盖
          if [ -n "$DESC" ]; then
            echo "DESC 已设置为自定义值：$DESC"
          else
            DESC="$GitHub_Release"
            echo "DESC 未设置，使用文件内容：$DESC"
          fi
          
          # 写入环境变量（使用 EOF 分隔符支持多行内容）
          echo "DESC<<EOF" >> $GITHUB_ENV
          echo "$DESC" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "GITHUB_RELEASE<<EOF" >> $GITHUB_ENV
          echo "$GitHub_Release" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "═══════════════════════════════════════════"
          echo "最终设置值："
          echo "  DESC           : $DESC"
          echo "  GITHUB_RELEASE : $GitHub_Release"
          echo "  tag_name : ${{ needs.build-exe.outputs.tag_name }}"
          echo "═══════════════════════════════════════════"


      - name: 2. 下载所有 artifact
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: ${{ github.workspace }}/artifacts/
          #merge-multiple: true

      - name: 3. 检查 artifact
        run: |
          echo "当前工作目录：$(pwd)"
          echo "🚀 检查 ${{ github.workspace }}/artifacts"
          echo "${{ github.workspace }}/artifacts 最终内容预览："
          tree ${{ github.workspace }}/artifacts || ls -R ${{ github.workspace }}/artifacts

      - name: 4. 创建 Release 并上传文件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-exe.outputs.tag_name }}
          name: ${{ needs.build-exe.outputs.tag_name }}
          files: |
            ${{ github.workspace }}/artifacts/${{env.JARS_ZIP}}/*.zip
            ${{ github.workspace }}/artifacts/jar-files/*.jar
            ${{ github.workspace }}/artifacts/windows-exes/*.exe
            ${{ github.workspace }}/artifacts/windows-standalone/*.zip
          body: |
            **下载地址**
            |文件名|GitHub Releases|直接地址|代理地址|
            |:--:|:--:|:--:|:--:|
            |${{ github.event.repository.name }}-Windows.zip|[github](https://github.com/${{ github.repository }}/releases/tag/${{ needs.build-exe.outputs.tag_name }})|[download](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-exe.outputs.tag_name }}/${{ github.event.repository.name }}-Windows.zip)|[download](https://cdn.gh-proxy.org/github.com/${{ github.repository }}/releases/download/${{ needs.build-exe.outputs.tag_name }}/${{ github.event.repository.name }}-Windows.zip)|
            |${{ github.event.repository.name }}.exe|[github](https://github.com/${{ github.repository }}/releases/tag/${{ needs.build-exe.outputs.tag_name }})|[download](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-exe.outputs.tag_name }}/${{ github.event.repository.name }}.exe)|[download](https://cdn.gh-proxy.org/github.com/${{ github.repository }}/releases/download/${{ needs.build-exe.outputs.tag_name }}/${{ github.event.repository.name }}.exe)|
            |${{ github.event.repository.name }}.jar|[github](https://github.com/${{ github.repository }}/releases/tag/${{ needs.build-exe.outputs.tag_name }})|[download](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-exe.outputs.tag_name }}/${{ github.event.repository.name }}.jar)|[download](https://cdn.gh-proxy.org/github.com/${{ github.repository }}/releases/download/${{ needs.build-exe.outputs.tag_name }}/${{ github.event.repository.name }}.jar)|
            
            **发布信息**
            - 标签：${{ needs.build-exe.outputs.tag_name }}
            - Java 版本：${{ needs.build-exe.outputs.java_version }}
            
            ### 🏆 推荐下载（完全独立运行，无需安装 Java）
            ${{ github.event.repository.name }}-Windows.zip  
            → 解压后直接双击 .exe 运行
            
            ### 📦 其他文件
            - jars-*.zip：原始 JAR 包
            - 单个 .jar / .exe
            
            ${{ env.DESC }}
            
            **系统要求**：Windows 10/11 x64  
            **运行方式**：推荐使用独立包，双击即跑
            
            如有问题欢迎反馈！
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 重置GitHub_Release
        run: |
          # 初始化默认值
          GitHub_Release_Text_Path="${{ github.event.inputs.gitHub_release_text_path || 'GitHub-Release.txt' }}"
          # 移除可能存在的前导斜杠
          GitHub_Release_Text_Path="${GitHub_Release_Text_Path#/}"
          # 构造文件路径（使用正确的仓库路径）
          GitHub_Release_Path="${{ github.workspace }}/$GitHub_Release_Text_Path"
          source $GITHUB_WORKSPACE/.github/workflows/bash/update-version.sh
          restart_github_release "${{ needs.build-exe.outputs.tag_name }}" "$GitHub_Release_Path"

  # ============ 只构建 Docker 镜像，不推送 ============
  build-docker:
    runs-on: ubuntu-latest
    needs: build-jar # 添加依赖关系
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      tag_name: ${{ needs.build-jar.outputs.tag_name }}
      java_version: ${{ needs.build-jar.outputs.java_version }}
      push_to_docker_registry: ${{ needs.build-jar.outputs.push_to_docker_registry }}
      push_to_github_release: ${{ needs.build-jar.outputs.push_to_github_release }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # 下载之前工作流的构建产物
      - name: Download JAR artifacts
        uses: actions/download-artifact@v8
        with:
          name: jar-files
          path: ./

      - name: List downloaded files
        run: ls -la ./

      - name: 配置
        run: |
          java_version=${{ needs.build-jar.outputs.java_version }}
          source $GITHUB_WORKSPACE/.github/workflows/bash/docker.sh
          createDockerfile "${java_version}"
      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4
      # 提取 Docker 镜像元数据
      - name: 提取 Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build-jar.outputs.tag_name||github.ref_name }}
            type=raw,value=latest,enable=${{ needs.build-jar.outputs.push_to_github_release == 'true' && needs.build-jar.outputs.push_to_docker_registry == 'true' }}
      # 构建 Docker 镜像（只构建并加载到本地，不推送）
      - name: 构建 Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.DOCKER_FILE_NAME}}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAVA_VERSION=${{needs.build-jar.outputs.java_version}}
            JAR_FILE_PATH=./*.jar
      # 验证构建的镜像
      - name: 验证构建 Docker image
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/docker.sh
          # 获取预期的镜像标签
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          validateBuildDockerImage "$IMAGE_TAG" 30
      # 保存 Docker 镜像为 tar 文件
      - name: 保存 Docker 镜像为 tar 文件
        run: |
          source $GITHUB_WORKSPACE/.github/workflows/bash/docker.sh
          saveDockerImage "${{ steps.meta.outputs.tags }}" "${{ needs.build-jar.outputs.tag_name }}"
      # 创建使用说明 Markdown 文件
      - name: 创建 Docker 使用说明文档 (README-Docker-Usage.md)
        run: |
          name=${{ github.event.repository.name }}
          tag_name=${{ needs.build-jar.outputs.tag_name}}
          run_id=${{ github.run_id }}
          tar_file_name=${{ env.TAR_FILE_NAME }}
          source $GITHUB_WORKSPACE/.github/workflows/bash/docker.sh
          createDockerUsageReadme "$name" "$tag_name" "$run_id" "$tar_file_name"

      - name: 上传 Docker 镜像 tar 文件为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-artifact
          path: |
            ${{ env.TAR_FILE_NAME }}
            README-Docker-Usage.md
          # retention-days: 5 # 设置保留天数为5天
  # ============ 推送 Docker 镜像到镜像仓库 ============
  push-docker:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: ${{ needs.build-docker.outputs.push_to_docker_registry == 'true' }}
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      tag_name: ${{ needs.build-docker.outputs.tag_name }}
      java_version: ${{ needs.build-docker.outputs.java_version }}
      push_to_docker_registry: ${{ needs.build-docker.outputs.push_to_docker_registry }}
      push_to_github_release: ${{ needs.build-docker.outputs.push_to_github_release }}   # ✅ 新增
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # 下载上一个 job 产出的镜像 tar 包
      - name: 下载 Docker 镜像 tar Artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-artifact
          path: ./
      # ✅ 新增：下载 JAR 产物，作为重新构建的上下文
      - name: 下载 JAR Artifact
        uses: actions/download-artifact@v8
        with:
          name: jar-files
          path: ./

      - name: List downloaded files
        run: ls -la ./
      # 重新生成 Dockerfile（跨 job 后 DOCKER_FILE_NAME/Dockerfile 都不存在）
      - name: 配置
        run: |
          java_version=${{ needs.build-docker.outputs.java_version }}
          source $GITHUB_WORKSPACE/.github/workflows/bash/docker.sh
          createDockerfile "${java_version}"
      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4
      # 登录到 GitHub Container Registry
      - name: 登录 Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 提取 Docker 镜像元数据
#      - name: 提取 Docker 镜像元数据
#        id: meta
#        uses: docker/metadata-action@v6
#        with:
#          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
#          tags: |
#            type=raw,value=${{ needs.build-jar.outputs.tag_name||github.ref_name }}
#            type=raw,value=latest,enable=${{ needs.build-jar.outputs.push_to_github_release == 'true' && needs.build-jar.outputs.push_to_docker_registry == 'true' }}
      # 构建和推送 Docker 镜像
      - name: Push Docker Images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.DOCKER_FILE_NAME }}
          push: true
          tags: ${{ needs.build-docker.outputs.image_tags }} # ✅ 复用上游算好的标签！
          load: false
          # 复用 build-docker 写入的 gha 缓存，命中后几乎瞬间完成
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAVA_VERSION=${{ needs.build-docker.outputs.java_version }}
            JAR_FILE_PATH=./*.jar


