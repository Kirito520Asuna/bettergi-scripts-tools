# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Java Jar To Zip Publish
run-name: "[${{ (github.event_name == 'push' || ((inputs.push_to_docker_registry || inputs.push_to_github_release) == true)) && '正式版' || '测试版' }}] ${{ github.event.repository.name }} ${{ github.event.inputs.tag_name || github.ref_name || 'v-manual' }}  version"

on:
  push:
    branches:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '输入 Release 标签 (eg: v0.35.1, v0.36.5-alpha.1)'
        required: false
        type: string
        default: 'v-manual'
      skip_tests:
        description: '是否跳过测试 (true/false)'
        required: true
        type: boolean
        default: false
      java_version:
        description: '输入 Java 版本 (如 8, 11, 17)'
        required: true
        default: '8'
      jar_dir_prefix:
        description: 'JAR 文件前缀 (如 bgi-tools 或留空)'
        default: ''
      draft:
        description: '是否为草稿 Release (true/false)'
        type: boolean
        default: false
      prerelease:
        description: '是否为预发布 Release (true/false)'
        type: boolean
        default: false
      push_to_docker_registry:
        description: '是否推送到docker镜像仓库'
        required: true
        type: boolean
        default: false
      push_to_github_release:
        description: '是否推送到Github Release'
        required: true
        type: boolean
        default: false
      desc:
        description: 'Release 描述信息'
        required: false
        type: string
        default: ''
      icon_path:
        description: 'icon 图标'
        required: false
        type: string
        default: 'frontend/public/favicon.ico'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release-jar:
    runs-on: ubuntu-latest
    # 定义 outputs 以便后续 job 使用
    outputs:
      tag_name: ${{ steps.set_vars.outputs.tag_name }}
      java_version: ${{ steps.set_vars.outputs.java_version }}
      jar_dir_prefix: ${{ steps.set_vars.outputs.jar_dir_prefix }}
      push_to_docker_registry: ${{ steps.set_vars.outputs.push_to_docker_registry }}
      push_to_github_release: ${{ steps.set_vars.outputs.push_to_github_release }}
    permissions:
      contents: write
      #releases: write
      actions: read
    steps:
      - name: 1.调试触发信息
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Tag Name: ${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "Skip Tests: ${{ github.event.inputs.skip_tests || true }}"
          echo "Java Version: ${{ github.event.inputs.java_version ||secrets.JAVA_VERSION|| '8' }}"
          echo "Jar Dir Prefix: ${{ github.event.inputs.jar_dir_prefix || 'bgi-tools' }}"
          echo "Draft: ${{ github.event.inputs.draft || false }}"
          echo "Prerelease: ${{ github.event.inputs.prerelease || false }}"
          echo "Repository: ${{ github.repository }}"
          echo "SHA: ${{ github.sha }}"

      - name: 2.检出代码
        uses: actions/checkout@v4

      - name: 3.设置输入值
        id: set_vars
        run: |
          # ─────────────── 初始化默认值 ───────────────
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name || 'v-manual' }}"

          # 处理布尔值时要小心：workflow_dispatch 的 inputs 是字符串，需要转换
          SKIP_TESTS="${{ inputs.skip_tests || 'false' }}"   # 先取输入，默认 false（字符串）
          if [[ "$SKIP_TESTS" == "true" || "$SKIP_TESTS" == "1" ]]; then
            SKIP_TESTS=true
          else
            SKIP_TESTS=false
          fi

          JAVA_VERSION="${{ inputs.java_version || secrets.JAVA_VERSION || '8' }}"
          JAR_DIR_PREFIX="${{ inputs.jar_dir_prefix || 'bgi-tools' }}"
          DRAFT="${{ inputs.draft || 'false' }}"
          PRERELEASE="${{ inputs.prerelease || 'false' }}"

          # ─────────────── 事件类型（提前替换） ───────────────
          EVENT_NAME="${{ github.event_name }}"
          
          # 默认值
          AUTO=false
          PUSH_TO_DOCKER_REGISTRY=false
          PUSH_TO_GITHUB_RELEASE=false
          
          # 核心判断逻辑
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$TAG_NAME" == v* ]]; then
            # push 到 v 开头的 tag/分支 → 视为正式自动发布
            AUTO=true
            PUSH_TO_DOCKER_REGISTRY=true
            PUSH_TO_GITHUB_RELEASE=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # 手动触发 → 完全尊重用户输入
            [[ "${{ inputs.push_to_docker_registry }}" == "true" ]] && PUSH_TO_DOCKER_REGISTRY=true
            [[ "${{ inputs.push_to_github_release }}" == "true" ]] && PUSH_TO_GITHUB_RELEASE=true
            # AUTO 保持 false（手动不是自动）
          else
            # 其他事件（如 pull_request、schedule 等）→ 默认不 push
            PUSH_TO_DOCKER_REGISTRY=false
            PUSH_TO_GITHUB_RELEASE=false
          fi

          # ─────────────── 写入环境变量 ───────────────
          echo "AUTO=$AUTO" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "SKIP_TESTS=$SKIP_TESTS" >> $GITHUB_ENV
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
          echo "JAR_DIR_PREFIX=$JAR_DIR_PREFIX" >> $GITHUB_ENV
          echo "DRAFT=$DRAFT" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV
          echo "PUSH_TO_DOCKER_REGISTRY=$PUSH_TO_DOCKER_REGISTRY" >> $GITHUB_ENV
          echo "PUSH_TO_GITHUB_RELEASE=$PUSH_TO_GITHUB_RELEASE" >> $GITHUB_ENV
          
          # ─────────────── 新增：只为 outputs 设置小写版本 ───────────────
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "java_version=$JAVA_VERSION" >> $GITHUB_OUTPUT
          echo "jar_dir_prefix=$JAR_DIR_PREFIX" >> $GITHUB_OUTPUT
          echo "push_to_docker_registry=$PUSH_TO_DOCKER_REGISTRY" >> $GITHUB_OUTPUT
          echo "push_to_github_release=$PUSH_TO_GITHUB_RELEASE" >> $GITHUB_OUTPUT

          # 调试输出（强烈推荐保留）
          echo "═══════════════════════════════════════════"
          echo "最终设置值："
          echo "  AUTO                   : $AUTO"
          echo "  TAG_NAME               : $TAG_NAME"
          echo "  SKIP_TESTS             : $SKIP_TESTS"
          echo "  JAVA_VERSION           : $JAVA_VERSION"
          echo "  JAR_DIR_PREFIX         : $JAR_DIR_PREFIX"
          echo "  DRAFT                  : $DRAFT"
          echo "  PRERELEASE             : $PRERELEASE"
          echo "  PUSH_TO_DOCKER_REGISTRY: $PUSH_TO_DOCKER_REGISTRY"
          echo "  PUSH_TO_GITHUB_RELEASE : $PUSH_TO_GITHUB_RELEASE"
          echo "═══════════════════════════════════════════"

      - name: 4.验证版本号
        run: |
          echo "当前版本号: $TAG_NAME"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "❌ 错误：版本格式必须符合语义化版本规范 (例如: v1.2.3, v1.2.3-alpha, v1.2.3+build.123)"
            exit 1
          fi
          echo "版本号验证通过"

      - name: 5.设置 Java 环境 version=${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 6.缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 7.使用 Maven 构建并生成 JAR
        run: |
          if [ ${{ env.SKIP_TESTS }} ]; then
            echo "跳过测试"
            echo "mvn clean package -B -DskipTests -Dquickly"
            mvn clean package -B -DskipTests -Dquickly
          else
            echo "mvn clean package -B -Dquickly"
            mvn clean package -B -Dquickly
          fi
          echo "Maven 构建完成"
          echo "匹配的 JAR 文件 (*/target/*.jar):"
          find . -type f -path "*/target/*.jar"
          echo "匹配的 JAR 文件 (*/${{ env.JAR_DIR_PREFIX  }}/target/*.jar):"
          find . -type f -path "*/${{ env.JAR_DIR_PREFIX  }}/target/*.jar" || echo "未找到匹配的 JAR 文件"

      - name: 8.列出匹配的 JAR 文件
        run: |
          if [ "${{ env.JAR_DIR_PREFIX  }}" = "" ]; then
            echo "匹配的 JAR 文件 (*/target/*.jar):"
            find . -type f -path "*/target/*.jar" || echo "未找到匹配的 JAR 文件"
          else
            echo "匹配的 JAR 文件 (*/${{ env.JAR_DIR_PREFIX  }}/target/*.jar):"
            find . -type f -path "*/${{ env.JAR_DIR_PREFIX  }}/target/*.jar" || echo "未找到匹配的 JAR 文件"
            echo "匹配的 JAR 文件 (*/${{ env.JAR_DIR_PREFIX  }}/*/target/*.jar):"
            find . -type f -path "*/${{ env.JAR_DIR_PREFIX  }}/*/target/*.jar" || echo "未找到匹配的 JAR 文件"  
          fi

      - name: 9.打包所有 JAR 文件成 ZIP
        run: |
          if [ "${{ env.JAR_DIR_PREFIX }}" = "" ]; then
            find . -type f -path "*/target/*.jar" -exec zip -j jars-${{ env.TAG_NAME }}.zip {} +
          else
            find . -type f \( -path "*/${{ env.JAR_DIR_PREFIX }}/target/*.jar" -o -path "*/${{ env.JAR_DIR_PREFIX }}/*/target/*.jar" \) -print0 | xargs -0 -I {} zip -j "jars-${{ env.TAG_NAME }}.zip" {}
          fi
          # -j: 仅打包文件，不保留目录结构
          # +: 尽量将多个文件放入一个 zip 命令，减少调用次数
        shell: bash

      - name: 10.验证 ZIP 文件
        run: |
          ls -la jars-${{ env.TAG_NAME}}.zip
          echo "ZIP 文件内容:"
          unzip -l jars-${{ env.TAG_NAME }}.zip

      - name: 11.解压 ZIP 文件
        run: |
          mkdir -p extracted-jars
          unzip jars-${{ env.TAG_NAME }}.zip -d extracted-jars
          echo "解压后的文件:"
          ls -la extracted-jars

      - name: 12. 将 JAR 文件转换为独立 EXE（捆绑私有 JRE，完全独立运行）
        run: |
          # ============ 下载 Launch4j ============
          wget --tries=5 --timeout=60 \
            https://pilotfiber.dl.sourceforge.net/project/launch4j/launch4j-3/3.50/launch4j-3.50-linux-x64.tgz?viasf=1 \
            -O /tmp/launch4j.tgz || \
          wget --tries=5 \
            https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-linux-x64.tgz/download \
            -O /tmp/launch4j.tgz

          tar -xzf /tmp/launch4j.tgz -C /tmp

          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-i686 gcc-mingw-w64-i686 binutils-mingw-w64-i686

          ln -sf /usr/bin/i686-w64-mingw32-windres /tmp/launch4j/bin/windres
          ln -sf /usr/bin/i686-w64-mingw32-ld /tmp/launch4j/bin/ld

          # ============ 下载 Windows x64 JDK 用于提取/捆绑运行时 ============
          echo "📦 正在下载 Adoptium Temurin Java ${{ env.JAVA_VERSION }} Windows x64 JDK"

          sudo apt-get install -y jq

          API_URL="https://api.adoptium.net/v3/assets/latest/${{ env.JAVA_VERSION }}/hotspot?image_type=jdk&os=windows&arch=x64&vendor=adoptium"

          DOWNLOAD_URL=$(curl -s -f "$API_URL" | jq -r '.[0].binary.package.link // empty')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "❌ Adoptium API 未返回有效下载链接"
            echo "请检查版本 ${{ env.JAVA_VERSION }} 是否存在，或网络问题"
            exit 1
          fi

          echo "下载链接: $DOWNLOAD_URL"
          wget -q --show-progress "$DOWNLOAD_URL" -O /tmp/jdk.zip || { echo "下载失败"; exit 1; }

          # 解压到临时目录
          TEMP_EXTRACT_DIR=$(mktemp -d /tmp/jdk_extract_XXXXXX)
          unzip -q /tmp/jdk.zip -d "$TEMP_EXTRACT_DIR"

          JDK_ROOT_DIR=$(find "$TEMP_EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)

          if [ -z "$JDK_ROOT_DIR" ]; then
            echo "❌ 未找到解压后的 JDK 根目录"
            ls -la "$TEMP_EXTRACT_DIR"
            exit 1
          fi

          echo "JDK 根目录: $JDK_ROOT_DIR"
          ls -la "$JDK_ROOT_DIR" | head -n 8

          # ============ 根据版本处理运行时 ============
          mkdir -p extracted-jars

          JAVA_VER_NUM=$((10#${{ env.JAVA_VERSION }}))

          if (( JAVA_VER_NUM <= 8 )); then
            JRE_SOURCE_DIR="$JDK_ROOT_DIR/jre"
            if [ ! -d "$JRE_SOURCE_DIR" ]; then
              echo "❌ JDK 8 模式下未找到 jre 子目录"
              ls -la "$JDK_ROOT_DIR"
              exit 1
            fi
            mv "$JRE_SOURCE_DIR" extracted-jars/jre
            echo "✅ 已提取 JDK 8 私有 JRE"
          else
            # JDK 9+ 直接使用整个 JDK 作为运行时，重命名为 jre
            mv "$JDK_ROOT_DIR" extracted-jars/jre
            echo "✅ 使用完整 JDK 作为捆绑运行时（Java ${{ env.JAVA_VERSION }}）"
            echo "  → 运行时目录结构示例："
            ls -la extracted-jars/jre | head -n 8
          fi

          # 显示大小统计
          echo "捆绑运行时大小："
          du -sh extracted-jars/jre

          # 清理临时文件
          rm -rf "$TEMP_EXTRACT_DIR" /tmp/jdk.zip

          # ============ 版本信息处理 ============
          RAW_TAG=${TAG_NAME#v}
          RAW_TAG=${RAW_TAG:-0.0.1}
          CLEAN_VERSION=$(echo "$RAW_TAG" | sed 's/[^0-9.]//g' | sed 's/^\.*//; s/\.*$//; s/\.\.+/\./g')
          CLEAN_VERSION=${CLEAN_VERSION:-0.0.1}

          IFS='.' read -r -a parts <<< "$CLEAN_VERSION"
          major=${parts[0]:-0} minor=${parts[1]:-0} patch=${parts[2]:-0} build=${parts[3]:-0}
          FILE_VERSION="$major.$minor.$patch.$build"
          TXT_VERSION="${TAG_NAME:-v$major.$minor.$patch}"
          echo "版本信息: FileVersion=$FILE_VERSION, TxtVersion=$TXT_VERSION"

          # ============ 为每个 JAR 生成独立 EXE ============
          for jar_file in extracted-jars/*.jar; do
            [ -f "$jar_file" ] || { echo "❌ 未找到任何 JAR 文件"; exit 1; }
            jar_name=$(basename "$jar_file" .jar)
            exe_file="extracted-jars/${jar_name}.exe"

            abs_jar=$(realpath "$jar_file")
            abs_exe=$(realpath -m "$exe_file")

            main_class=$(unzip -p "$jar_file" META-INF/MANIFEST.MF | grep '^Main-Class:' | sed 's/^Main-Class: *//' | tr -d '\r')
            if [ -z "$main_class" ]; then
              echo "⚠️ $jar_file 无 Main-Class，跳过生成 EXE"
              continue
            fi

            config_file="/tmp/launch4j_${jar_name}_config.xml"
            cat > "$config_file" << EOF
          <launch4jConfig>
            <dontWrapJar>false</dontWrapJar>
            <headerType>console</headerType>
            <jar>$abs_jar</jar>
            <outfile>$abs_exe</outfile>
            <errTitle>${{ github.event.repository.name }} Error</errTitle>
            <classPath>
              <mainClass>$main_class</mainClass>
            </classPath>
            <jre>
              <path>jre;%JAVA_HOME%;%PATH%</path>
              <minVersion>${{ env.JAVA_VERSION }}.0</minVersion>
              <maxVersion>${{ env.JAVA_VERSION }}.999</maxVersion>
              <jdkPreference>preferBundled</jdkPreference>
              <requiresJdk>false</requiresJdk>
            </jre>
            <versionInfo>
              <fileVersion>$FILE_VERSION</fileVersion>
              <txtFileVersion>$TXT_VERSION</txtFileVersion>
              <productVersion>$FILE_VERSION</productVersion>
              <txtProductVersion>$TXT_VERSION</txtProductVersion>
              <fileDescription>${{ github.event.repository.name }} Standalone (Java ${{ env.JAVA_VERSION }})</fileDescription>
              <copyright>Copyright (c) 2023-$(date +%Y)</copyright>
              <productName>${{ github.event.repository.name }}</productName>
              <internalName>${jar_name}</internalName>
              <originalFilename>${jar_name}.exe</originalFilename>
            </versionInfo>
            <!-- 添加图标配置 -->
            <icon>/home/runner/work/${{github.event.repository.name }}/${{github.event.repository.name }}/${{ github.event.inputs.icon_path }}</icon>
          </launch4jConfig>
          EOF

            echo "生成 EXE 配置: $config_file"
            echo "正在生成独立 EXE: $exe_file"

            java -Djava.awt.headless=true -jar /tmp/launch4j/launch4j.jar "$config_file"

            if [ -f "$exe_file" ]; then
              echo "🎉 成功生成: $exe_file (大小: $(du -h "$exe_file" | cut -f1))"
            else
              echo "❌ 生成失败"
              cat /tmp/launch4j/launch4j.log 2>/dev/null || true
              exit 1
            fi
          done

          echo "=== 最终 extracted-jars 目录内容 ==="
          ls -lh extracted-jars/
          du -sh extracted-jars/jre extracted-jars/*.exe 2>/dev/null || true

          # 清理 Launch4j 临时文件
          rm -rf /tmp/launch4j /tmp/launch4j.tgz /tmp/launch4j_*_config.xml
        shell: bash


      - name: 13. 打包仅含 EXE + JRE + 配置文件的独立运行包
        run: |
          # 创建临时打包目录
          mkdir -p standalone-package

          # 复制 EXE 和 jre 文件夹
          cp extracted-jars/*.exe standalone-package/ 2>/dev/null || echo "无 EXE"
          cp -r extracted-jars/jre standalone-package/ 2>/dev/null || echo "无 jre"

          # 关键：复制 application-prod.yml 到打包目录（与 EXE 同级）
          if [ -f src/main/resources/application-prod.yml ]; then
            cp src/main/resources/application-prod.yml standalone-package/
            echo "✅ 已包含 application-prod.yml 配置文件"
          else
            echo "⚠️ 未找到 src/main/resources/application-prod.yml，使用默认模板创建"
            cat > standalone-package/application-prod.yml << 'EOF'
          server:
            port: 8081
            #servlet:
              #context-path: /bgi #不要修改
          
          ws:
            url: ws://localhost:8081/ws # 可忽略，程序内部自动计算
            access-token-name: access-token
          EOF
          fi
          
          # 打成 ZIP
          cd standalone-package
          zip -r ../${{ github.event.repository.name }}-Windows-${{ env.TAG_NAME }}.zip ./*
          cd ..
          
          echo "✅ 独立运行包打包完成（包含 EXE + jre + application-prod.yml）"
          ls -lh ${{ github.event.repository.name }}-Windows-${{ env.TAG_NAME }}.zip
          du -sh ${{ github.event.repository.name }}-Windows-${{ env.TAG_NAME }}.zip     

      - name: 14. 上传到 GitHub Release（包含独立 EXE 包）
        uses: softprops/action-gh-release@v2
        if: ${{ env.PUSH_TO_GITHUB_RELEASE == 'true' }}
        #if: ${{ github.event_name == 'push' || inputs.push_to_github_release == true }}
        with:
          name: ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          files: |
            jars-${{ env.TAG_NAME }}.zip
            extracted-jars/*.jar
            extracted-jars/*.exe
            ${{ github.event.repository.name }}-Windows-${{ env.TAG_NAME }}.zip
          body: |
            **Release 信息**
            - 标签: ${{ env.TAG_NAME }}
            - Java 版本: ${{ env.JAVA_VERSION}}
            **${{ github.event.repository.name }} ${{ env.TAG_NAME }} 发布**

            ### 🏆 推荐下载（完全独立运行，无需安装 Java）
            - **${{ github.event.repository.name }}-Windows-${{ env.TAG_NAME }}.zip**  
              → 解压后直接双击 `.exe` 文件运行（已内置 Java 运行时）

            ### 📦 其他文件
            - `jars-${{ env.TAG_NAME }}.zip`：原始 JAR 包
            - 单个 `.jar` 文件：供开发者使用
            - 单个 `.exe` 文件：仅 EXE（需系统已安装 Java ${{ env.JAVA_VERSION}}）
            
            ${{github.event.inputs.desc}} 
            
            **系统要求**：Windows 10/11 x64  
            **运行方式**：推荐使用独立包，双击即跑

            如有问题欢迎反馈！
          draft: ${{ env.DRAFT == true || false }}
          prerelease: ${{ env.PRERELEASE == true || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      # 在步骤 之后添加新的 artifact 上传步骤
      - name: Upload JAR files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-files
          path: extracted-jars/*.jar

      - name: 上传独立 EXE 包作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-Windows-Standalone
          path: ${{ github.event.repository.name }}-Windows-${{ env.TAG_NAME }}.zip

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build-and-release-jar  # 添加依赖关系
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载之前工作流的构建产物
      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-files
          path: ./

      - name: List downloaded files
        run: ls -la ./

      - name: 配置
        run: |
          DOCKER_FILE_NAME="Dockerfile"
          if [ -f "$DOCKER_FILE_NAME" ]; then
              echo "$DOCKER_FILE_NAME already exists"
              cat "$DOCKER_FILE_NAME"
          else
              cat > "$DOCKER_FILE_NAME" << EOF
              FROM eclipse-temurin:${{ needs.build-and-release-jar.outputs.java_version }}-jre-alpine
              VOLUME /tmp
              WORKDIR /app
              COPY *.jar app.jar
              ENTRYPOINT ["java","-jar","app.jar"]
          EOF
              if [ -f "$DOCKER_FILE_NAME" ]; then
                echo "$DOCKER_FILE_NAME created successfully"
                cat "$DOCKER_FILE_NAME"
              else
              echo "Error: $DOCKER_FILE_NAME creation failed"
              exit 1
              fi
          fi          
          
          echo "DOCKER_FILE_NAME=$DOCKER_FILE_NAME" >> $GITHUB_ENV

      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 登录到 GitHub Container Registry
      - name: 登录 Log in to Container Registry
        if: ${{ needs.build-and-release-jar.outputs.push_to_docker_registry == 'true' }}
        #if: ${{ github.event_name == 'push' || inputs.push_to_docker_registry == true }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取 Docker 镜像元数据
      - name: 提取 Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      

      # 构建并推送 Docker 镜像
      - name: 构建并推送 Docker image
        uses: docker/build-push-action@v4
        #if: ${{ needs.build-and-release-jar.outputs.push_to_docker_registry == 'true' }}
        #if: ${{ github.event_name == 'push' || inputs.push_to_docker_registry == true }}
        with:
          context: .
          file: ./${{ env.DOCKER_FILE_NAME}}
          push: ${{ needs.build-and-release-jar.outputs.push_to_docker_registry == 'true' }}
          #push: ${{ github.event_name == 'push' || inputs.push_to_docker_registry == true }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAVA_VERSION=${{needs.build-and-release-jar.outputs.java_version}}
            JAR_FILE_PATH=./*.jar

      # 验证构建的镜像
      - name: 验证构建 Docker image
        run: |
          docker images
          #if [ "${{ github.event_name == 'push' || inputs.push_to_docker_registry == true }}" ]; then
          if [ "${{ needs.build-and-release-jar.outputs.push_to_docker_registry == 'true' }}" ]; then
            echo "Docker image pushed successfully"
          else
            echo "Docker image built locally only"
          fi
      

      # ============ 新增：保存并上传 Docker 镜像 ============
      - name: 保存 Docker 镜像为 tar 文件
        run: |
          # 取得第一个 tag（通常是最主要的那个）
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "正在保存的镜像标签: $IMAGE_TAG"

          # 使用最安全的文件名策略：版本号 + 时间戳
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAR_FILE_NAME="docker-${{ needs.build-and-release-jar.outputs.tag_name }}-${TIMESTAMP}.tar"

          echo "最终安全文件名: $TAR_FILE_NAME"

          # 检查镜像是否存在
          if ! docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "❌ 镜像 $IMAGE_TAG 不存在！当前本地镜像列表："
            docker images
            exit 1
          fi

          # 保存镜像
          docker save "$IMAGE_TAG" -o "$TAR_FILE_NAME"

          # 记录给下一步使用
          echo "TAR_FILE_NAME=$TAR_FILE_NAME" >> $GITHUB_ENV

      # 创建使用说明 Markdown 文件
      - name: 创建 Docker 使用说明文档 (README-Docker-Usage.md)
        run: |
          cat <<EOF > README-Docker-Usage.md
          # ${{ github.event.repository.name }} Docker 镜像使用说明

          **当前镜像版本**：${{ needs.build-and-release-jar.outputs.tag_name}}  
          **构建时间**：$(date '+%Y年%m月%d日 %H:%M:%S') (HKT)  
          **镜像标签示例**：ghcr.io/${{ github.repository }}:${{ needs.build-and-release-jar.outputs.tag_name }} 或 :latest

          这是一个**完整的 Docker 镜像导出包**（.tar 文件），包含 ${{ github.event.repository.name }} 应用及运行环境。  
          支持完全离线部署，无需联网拉取镜像，非常适合内网服务器、测试机或快速分发。

          ## 1. 导入镜像

          在任何安装了 Docker 的机器上，直接运行以下命令：

          \`\`\`bash
          # 使用 workflow 生成的精确文件名导入镜像
          docker load -i $TAR_FILE_NAME

          # 成功后会显示类似：
          # Loaded image: ghcr.io/${{ github.repository }}:${{ needs.build-and-release-jar.outputs.tag_name }}
          # Loaded image: ghcr.io/${{ github.repository }}:latest
          \`\`\`

          \`\`\`bash
          # 查看已导入的镜像
          docker images | grep ${{ github.event.repository.name }}
          \`\`\`

          ## 2. 启动容器（推荐方式）

          \`\`\`bash
          docker run -d \\
            --name ${{ github.event.repository.name }}\\
            -p 8081:8081 \\
            -v \$(pwd)/${{ github.event.repository.name }}:/app \\           # 可选：挂载配置文件目录
            --restart unless-stopped \\
            ghcr.io/${{ github.repository }}:${{needs.build-and-release-jar.outputs.tag_name }}
          \`\`\`

          - **默认端口**：8081（可在 application-prod.yml 中修改）  
          - **访问地址**：http://你的服务器IP:8081/bgi  
          - **配置文件挂载建议**：  
            在当前目录创建 config 文件夹，将 application-prod.yml 放入其中

          ## 3. 常用命令速查

          \`\`\`bash
          # 查看实时日志
          docker logs -f ${{ github.event.repository.name }}

          # 进入容器内部（调试用）
          docker exec -it ${{ github.event.repository.name }} /bin/sh

          # 停止并删除容器
          docker stop ${{ github.event.repository.name }} && docker rm ${{ github.event.repository.name }}
          \`\`\`

          ## 4. 注意事项

          - 需要 Docker 20.10 或更高版本
          - 当前镜像平台：linux/amd64（适用于大多数服务器和 PC）
          - 如遇端口冲突、网络问题，请检查：
            - 防火墙设置
            - 端口映射是否正确
            - 是否有其他程序占用 8081 端口
          - 问题反馈：欢迎在 GitHub Issues 留言

          **祝使用愉快！**  
          文档由 GitHub Actions 自动生成于构建 ${{ github.run_id }}
          EOF

          # 调试输出：确认文件名已正确展开
          echo "使用的 TAR_FILE_NAME 值：$TAR_FILE_NAME"
          echo "生成的 Markdown 文件内容预览："
          cat README-Docker-Usage.md      

      - name: 上传 Docker 镜像 tar 文件为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: |
            ${{ env.TAR_FILE_NAME }}
            README-Docker-Usage.md
          # retention-days: 5 # 设置保留天数为5天