on:
  # push:  # 如需 push 触发可取消注释
  #   branches:
  #     - master
  #   tags:
  #     - '**'
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（北京时间 08:00）

  workflow_dispatch:
#    inputs:
#      force_push:
#        description: '强制推送（跳过检查）'
#        required: false
#        default: 'false'
#        type: choice
#        options:
#          - 'true'
#          - 'false'

env:
  GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
  GITEE_OWNER: ${{ secrets.GITEE_USERNAME }}
  GITEE_REPO: bettergi-scripts-tools
  GITEE_BRANCH: master

  GITHUB_USERNAME: ${{ github.repository_owner || github.actor }}
  GITHUB_REPO_NAME: ${{ github.event.repository.name }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史记录
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync GitHub to Gitee
        uses: Kirito520Asuna/repo-sync-action@main
        with:
          # Git配置
          user_name: ${{ github.actor }}
          user_email: ${{ github.actor }}@users.noreply.github.com
          #源仓库配置
          src: github.com/${{env.GITHUB_USERNAME}}/${{env.GITHUB_REPO_NAME}}.git
          src_branch: ${{env.GITHUB_BRANCH}}
          src_username: ${{env.GITHUB_USERNAME}}
          src_token: ${{env.GITHUB_TOKEN}}
          #目标仓库配置
          dst: gitee.com/${{env.GITEE_OWNER}}/${{env.GITEE_REPO}}.git
          dst_branch: ${{env.GITEE_BRANCH}}
          dst_username: ${{env.GITEE_OWNER}}
          dst_token: ${{env.GITEE_TOKEN}}
          #是否强制同步
          force_push: 'true'
          git_post_buffer: 1048576000
          git_low_speed_limit: 1000
          git_low_speed_time: 60
          push_timeout: 3600
