api:
  #authorization: Authorization
  authorization: ${auth.token-name}
  common:
    version: 3.0.0
    title: SecuityAPI
    description: SecuityAPI
    termsOfService:
    license: 未经许可不得转载
    licenseUrl: xxx.license.com
    externalDocDesc:
    externalDocUrl:
    contact:
      name: kirito-asuna
      url:
      email:
springdoc:
  api-docs:
    path: /v3/api-docs
  # 请注意使用group名时如果配置了GroupedOpenApi引用自动配置时组名不能重复
  open:
    default-group-configs:
      enable: true
      api: true
      jwt: true
      other: true
      header:
        api:
          - name: sign
            value: X-Bgi-Tools-Sign
          - name: timestamp
            value: X-Bgi-Tools-Timestamp
  group-configs:
    - group: "api"
      paths-to-match: "/api/**"
    - group: "jwt"
      paths-to-match: "/jwt/**"
    - group: "other"
      paths-to-exclude:
        - "/swagger-resources/**"
        - "/v2/api-docs"
        - "/v3/api-docs"
        - "/api/**"
        - "/jwt/**"
  swagger-ui:
    operations-sorter: alpha
    path: /swagger-ui.html
    tags-sorter: alpha
#Authorization 在knife4j中失效==>替代方案 使用knife4j中全局参数设置Authorization
knife4j:
  cors: true
  enable: true
  setting:
    enable-dynamic-parameter: true
  #swagger
  basic:
    enable: ${auth.enabled:false}
    username: ${auth.users[0].username:root}
    password: ${auth.users[0].password:root}
sign:
  api:
    name: ${spring.application.name}
    ip-whitelist: #ip白名单
      - 127.0.0.1
      - localhost
    ip-blacklist: #ip黑名单
    salt: #签名盐值
    sign-enable: true #是否开启签名校验
    sign-multiple-enable: false #是否开启多签名校验
    sign-time-out: 10 #签名超时时间 默认单位分钟
    sign-time-unit: MINUTES #签名超时时间单位
    paths-to-match:
      - /api/**
      - /auth/login
    encryption-paths-to-exclude:
      - /key/exchangeKey
      - /api/key/exchangeKey
      - /jwt/key/exchangeKey
    sign-as-name: X-Bgi-Tools-Sign
    timestamp-as-name: X-Bgi-Tools-Timestamp
    enable-double-symmetric-encryption: false
    encryption-as-name: X-Bgi-Tools-Encryption-Client-Public-Key
    id-as-name: X-Bgi-Tools-Encryption-Id
server:
  port: 8081
  servlet:
    context-path: /bgi
  forward-headers-strategy: native # Spring Boot 2.2+ 支持，自动识别 X-Forwarded-* 头
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      port-header: X-Forwarded-Port
spring:
  application:
    name: bgi-tools
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  config:
    import:
      - optional:file:./application-prod.yml
      - optional:file:/app/application-prod.yml #docker加载异常处理
  profiles:
    active: dev
  quartz:
    auto-startup: false # 禁止自动启动调度器Delay
    startup-delay: 3s
  datasource:
    dynamic:
      primary: ${db.primary:SQLite}
      datasource:
        SQLite:
          driver-class-name: org.sqlite.JDBC
          url: ${db.SQLite.url:jdbc:sqlite:./cache/bgi-tools.db}
          username: ${db.SQLite.username:}
          password: ${db.SQLite.password:}
        MySQL:
          # MySQL配置示例（注释掉上面的SQLite配置，启用下面的MySQL配置）
          url: ${db.MySQL.url:jdbc:mysql://localhost:3306/bgi_tools?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${db.MySQL.username:root}
          password: ${db.MySQL.password:root}
        PgSQL:
          # PostgreSQL配置示例
          url: ${db.PgSQL.url:jdbc:postgresql://localhost:5432/bgi_tools}
          driver-class-name: org.postgresql.Driver
          username: ${db.PgSQL.username:postgres}
          password: ${db.PgSQL.password:root}
          #mvc:
    # 推荐开启这个，让 /** 映射优先级低于静态资源
    #static-path-pattern: /static/ui/**   # 可选，如果你想把静态资源路径改成 /static/ 开头
    #throw-exception-if-no-handler-found: true   # 可选，404 时抛异常方便调试
    #web:
    #resources:
    #static-locations:
    #- classpath:/static/ui/
    # 默认已经包含 classpath:/static/，通常不需要额外配置
    # 如果你把 dist 放在其他位置，可以加
    # static-locations: classpath:/static/,classpath:/public/
  #redis
  redis:
    mode: none
    host: 127.0.0.1
    port: 6379
    database: 0
    username:
    password:
    retryAttempts: 5
    retryInterval: 3000
    connect-timeout: 30000
    timeout: 30000
    # Redisson 内嵌配置（关键部分）
    redisson:
      file: classpath:redisson/redisson-${spring.redis.mode:none}.yml
  data:
    redis:
      mode: ${spring.redis.mode:none} # none:不使用redis，single:使用单体,cluster:使用集群，sentinel:使用哨兵
      #单体
      host: ${spring.redis.host:127.0.0.1}
      port: ${spring.redis.port:6379}
      database: ${spring.redis.database:0}
      #安全
      username: ${spring.redis.username:} #默认为空
      password: ${spring.redis.password:} #默认为空
      connect-timeout: ${spring.redis.connect-timeout:30000} #连接超时 30s
      timeout: ${spring.redis.timeout:30000} #响应超时时间
      retryAttempts: ${spring.redis.retryAttempts:5} # 重试 5 次
      retryInterval: ${spring.redis.retryInterval:3000}
      # 兼容 spring.data.redis 配置
      cluster:
        nodes: ${spring.redis.cluster.nodes:} # 集群节点
      sentinel:
        master: ${spring.redis.sentinel.master:} # 主节点名称
        nodes: ${spring.redis.sentinel.nodes:} # 哨兵节点
local:
  cache:
    dir: cache
    json-file-path: ${local.cache.dir}/bgi-tools.json
db:
  primary: SQLite
  SQLite:
    url: jdbc:sqlite:${local.cache.dir}/bgi-tools.db
    username:
    password:
  MySQL:
    url: jdbc:mysql://localhost:3306/bgi_tools?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your_password
  PgSQL:
    url: jdbc:postgresql://localhost:5432/bgi_tools
    username: postgres
    password: your_password
#需要验证的接口设置token
check:
  token: #注意：其中一项为空时将不会校验
    name: # token名称 默认为空
    value: # token值 默认为空
bgi-tools:
  version: 0.1.5
config:
  backup-path: backup
#设置默认账号密码
auth:
  enabled: true
  token-name: bgi_tools_token
  ttl:
    expiration-ms: 604800000 # 7天
    refresh-interval-expiration-ms: 86400000 # 24小时
  users:
    - username: bgi_tools
      password: bgi_tools
logging:
  #设置日志存储路径
  file:
    path: ./logs
    name: ${logging.file.path}/bgi-tools
  logback:
    rollingpolicy:
      #单个日志文件最大大小
      max-file-size: 10MB
      #保留的日志文件最大数量
      max-history: 30
      #日志文件总大小
      total-size-cap: 1GB
  level:
    #    org.mybatis.spring.mapper: debug
    com.cloud_guest.handler.LogWebSocketHandler: off
    com.cloud_guest.redis.service.impl: off
    com.cloud_guest.task.job: off
    com.cloud_guest.task.dstributed.DistributedJob: off
    com.cloud_guest.utils.ApplicationContextHolder: off
    com.cloud_guest.wrappers.lock: off
    com.cloud_guest.mapper: off
    com.cloud_guest: debug
    org.springframework.web.servlet.DispatcherServlet: off
management:
  endpoint:
    restart:
      enabled: true
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
